<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FinSight — AI Financial Markets Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
     <!-- ADD THIS -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background-color: #0a0f1d;
            color: #f3f4f6;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background-color: #0a0f1d;
            padding: 1.5rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
        }

        .logo-main {
            font-size: 1.75rem;
            font-weight: 700;
            color: #38bdf8; 
            letter-spacing: -0.02em;
        }

        .logo-sub {
            font-size: 0.85rem;
            color: #6b7280;
            font-weight: 400;
        }

        .header-right {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-left: auto;
}

        .container {
            display: flex;
            flex: 1;
            justify-content: center;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 2.5rem 0 2.5rem; 
            overflow: hidden;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            max-width: 80%;
            animation: slideIn 0.25s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.agent {
            align-self: flex-start;
        }

        .agent-icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: rgba(56, 189, 248, 0.15);
            border-radius: 50%;
            color: #38bdf8;
            flex-shrink: 0;
            margin-top: 4px;
        }

        .message-content-wrapper {
            display:flex;
            flex-direction:column;

            min-width:0;
            max-width:100%;
            overflow:hidden;
        }

        .message-content {
            padding: 1.2rem 1.5rem;
            border-radius: 1rem;
            word-wrap: break-word;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .message.user .message-content {
            background-color: #1e293b;
            color: #f3f4f6;
            border-top-right-radius: 0.25rem;
        }

        .message.agent .message-content {
            background-color: rgba(17, 24, 39, 0.7);
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-top-left-radius: 0.25rem;
        }

        .message-time {
            font-size: 0.75rem;
            color: #4b5563;
            padding-left: 0.25rem;
        }
        .message-content table{
            max-width:100%;
        }

        /* ← NEW: Feedback button styling */
        .feedback-buttons {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.5rem;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .feedback-buttons:hover {
            opacity: 1;
        }

        .feedback-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 0.3rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
        }

        .new-chat-btn {
            height: 40px;
            padding: 0 15px;
            display: flex;
            align-items: center;
            gap: 7px;

            background: rgba(15, 23, 42, 0.7);
            color: #cbd5e1;

            border: 1px solid rgba(96, 165, 250, 0.25);
            border-radius: 9px;

            font-size: 14px;
            font-weight: 500;

            cursor: pointer;
            transition: all 0.2s ease;
        }

        .new-chat-btn svg {
            width: 16px;
            height: 16px;
        }

        .new-chat-btn:hover {
            background: rgba(37, 99, 235, 0.15);
            border-color: rgba(56, 189, 248, 0.5);
            color: #f8fafc;
        }
        .toggle-intelligence-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .toggle-intelligence-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        .toggle-intelligence-btn.active {
            background: #38bdf8;
            color: #0a0f1d;
        }

        /* Hide sidebar by default */
        .chart-sidebar.hidden {
            display: none;
        }
        .feedback-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
        }

        .feedback-btn.submitted {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* File upload badge styling */
        .file-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            word-break: break-all;
        }

        .input-area {
            background-color: #0a0f1d;
            padding: 1.5rem 0 2.5rem 0;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        /* File input styling */
        .input-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex: 1;
        }

        .file-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            background-color: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #9ca3af;
            padding: 0.6rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            white-space: nowrap;
        }

        .file-input-label:hover {
            background-color: rgba(30, 41, 59, 1);
            border-color: rgba(56, 189, 248, 0.3);
            color: #38bdf8;
        }

        .input-container {
            flex: 1;
            display: flex;
            align-items: center;
            background-color: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 9999px;
            padding: 0.35rem 0.5rem 0.35rem 1.5rem;
            transition: all 0.2s ease;
            height: 56px;
        }

        .input-container:focus-within {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.15);
        }

        .input-icon {
            color: #4b5563;
            margin-right: 0.75rem;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .input-container textarea,
        .input-container input {
            flex: 1;
            background: none;
            border: none;
            color: #f3f4f6;
            font-family: inherit;
            font-size: 0.95rem;
            height: 100%;
            outline: none;
            padding: 0;
            resize: none;
        }
        
        .input-container textarea {
            padding: 0.6rem 0 !important;  
            line-height: 1.4;
        }

        .input-container textarea::placeholder,
        .input-container input::placeholder {
            color: #4b5563;
            opacity: 1;
        }

        .stock-search-box {
            position: relative;
            flex: 1;
            min-width: 0;
        }

        .stock-search-box input {
            width: 100%;
            box-sizing: border-box;
        }
        .btn-send {
            background-color: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #9ca3af;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .input-container input:not(:placeholder-shown) ~ .btn-send,
        .btn-send:hover {
            background-color: #38bdf8;
            color: #0a0f1d;
            border-color: #38bdf8;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #38bdf8;
            font-size: 0.9rem;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            background-color: #38bdf8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dot:nth-child(2) { animation-delay: -0.32s; }
        .loading-dot:nth-child(3) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    
        /* ===== CHAT INPUT IMPROVEMENTS ===== */

.chat-area .input-area {

        function showStockSuggestions(event) {

            const suggestionsDiv = document.getElementById('stockSuggestions');

                suggestionsDiv.style.display = 'none';
                return;
            }
            
            // Filter by both keys and values
            const filtered = allStocks.filter(stock => 
                stock.includes(input) || stockMappings[stock].toUpperCase().includes(input)
            );
            
            if (filtered.length === 0) {
                suggestionsDiv.style.display = 'none';
                return;
            }
            
            suggestionsDiv.innerHTML = filtered.map(stock => `
                <div style="padding: 0.5rem 1rem; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); color: #9ca3af;" 
                    onmouseover="this.style.backgroundColor='rgba(56,189,248,0.1)'; this.style.color='#38bdf8';" 
                    onmouseout="this.style.backgroundColor='transparent'; this.style.color='#9ca3af';"
                    onclick="selectStock('${stock}')">
                    ${stock} ${stock !== stockMappings[stock] ? `(${stockMappings[stock]})` : ''}

            `).join('');
            
            suggestionsDiv.style.display = 'block';

            if (event.key === "Enter") {

                    event.preventDefault();
                    const input = document.getElementById("userInput");
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    const text = input.value;
                    input.value = text.substring(0, start) + "\n" + text.substring(end);
                    input.selectionStart = input.selectionEnd = start + 1;
                } else {

                    sendMessage();

            }

        // ← MODIFIED: Add message function with feedback buttons
        function addMessage(text, sender) {
            const chatMessages = document.getElementById("chatMessages");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${sender}`;

            let innerStructure = '';
            const currentTime = getCurrentTimeLabel();
            const messageId = `msg_${Date.now()}`; // ← NEW: Unique ID

            if (sender === 'agent') {
                innerStructure += `

        // Disable buttons after feedback
        buttons.forEach(btn => btn.classList.add('submitted'));
        buttons.forEach(btn => btn.disabled = true);
    
        try {
            const formData = new FormData();
            formData.append("message_id", messageId);
            formData.append("feedback", feedbackType);
            formData.append("session_id", sessionId);
            formData.append("timestamp", new Date().toISOString());
        
            const response = await fetch(`${API_BASE}/feedback`, {
                method: "POST",
                body: formData  // ← CHANGED: Use FormData instead of JSON

        function formatResponse(text) {
            const lines = text.split('\n');
            let html = '';
            let i = 0;

            while (i < lines.length) {
                const line = lines[i];

                if (line.trim().startsWith('|')) {
                    let tableLines = [];
                    while (i < lines.length && lines[i].trim().startsWith('|')) {
                        tableLines.push(lines[i]);
                        i++;
                    }
                    html += renderTable(tableLines);
                } else if (line.trim()) {
                    html += `<p style="margin-bottom: 0.4rem; line-height: 1.6;">${escapeHtml(line)}</p>`;
                    i++;
                } else {
                    i++;
                }
            }

            return html || text;
        }

        function renderTable(tableLines) {
            if (tableLines.length < 2) return '';

            const headerLine = tableLines[0];
            const dataLines = tableLines.slice(2);

            const headers = headerLine.split('|')
                .map(h => h.trim())
                .filter(h => h && h !== '');

            const rows = dataLines
                .map(line => line.split('|')
                    .map(cell => cell.trim())
                    .filter((cell, idx) => idx > 0 && idx <= headers.length)
                )
                .filter(row => row.some(cell => cell));

            if (headers.length === 0) return '';

            let html = `
                <div style="background: #111827; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; margin: 1rem 0;width:100%;box-sizing:border-box;">
                    <table style="width:100%;table-layout:fixed;border-collapse:collapse;font-size:0.9rem;">
                        <thead>
                            <tr style="background: #1f2937; border-bottom: 1px solid rgba(255,255,255,0.1);">`;

            headers.forEach(header => {
                html += `<th style="color: #38bdf8; padding: 0.45rem 0.6rem; text-align: left; font-weight: 600;white-space:normal;word-break:break-word;overflow-wrap:anywhere;">${escapeHtml(header)}</th>`;
            });

            html += `</tr></thead><tbody>`;

            rows.forEach((row, idx) => {
                html += `<tr style="border-bottom: 1px solid rgba(255,255,255,0.02); background: ${idx % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.01)'};">`;
                row.forEach(cell => {
                    html += `<td style="padding: 0.45rem 0.6rem; color: #9ca3af;white-space:normal;word-break:break-word;overflow-wrap:anywhere;max-width:0;">${escapeHtml(cell)}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table></div>`;
            return html;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

// Draw candlestick chart using Plotly
function drawCandlestickChart(data) {

    const trace = {
        x: data.map(d => d.date),
        open: data.map(d => d.open),
        high: data.map(d => d.high),
        low: data.map(d => d.low),
        close: data.map(d => d.close),
        type: "candlestick",

        increasing: {
            line: { color: "#22c55e" },
            fillcolor: "#22c55e"
        },

        decreasing: {
            line: { color: "#ef4444" },
            fillcolor: "#ef4444"
        }
    };
    
    const isMobile = window.innerWidth <= 768;
    const layout = {

        autosize: true,
        height: isMobile ? 260 : 240,
        dragmode:"zoom",

        margin: {
            l: 35,
            r: 15,
            t: isMobile ? 40 : 10,
            b: 20
        },

        paper_bgcolor: "#111827",
        plot_bgcolor: "#111827",

        font: {
            color: "#CBD5E1"
        },

        showlegend: false,

        xaxis: {
    showgrid: true,
    gridcolor: "#1E293B",

    rangeslider: {
        visible: true
    },

    fixedrange: false,

    showline: false,
    zeroline: false,

    title: ""
},

        yaxis: {
            showgrid: true,
            gridcolor: "#1E293B",

            showline: false,
            zeroline: false,

            title: ""
        }

    };

    Plotly.react(
        "candlestickChart",
        [trace],
        layout,
        {
            responsive: true,
            displayModeBar: true
        }
    );
    if (window.innerWidth <= 768) {
        document.getElementById("candlestickChart").style.marginTop = "35px";
    } else {
        document.getElementById("candlestickChart").style.marginTop = "0";
    }

}

function generateSuggestions(ticker){

    const container=document.getElementById("suggestionButtons");

    const suggestions=[
        `Explain the PE ratio of ${ticker}`,

    ];

    container.innerHTML=suggestions.map(s=>`

            ${s}
        </button>

}
